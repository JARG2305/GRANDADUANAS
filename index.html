<!-- Script de Firebase y Lógica del Sistema Corregida -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const BACKEND_URL = window.location.origin;

        let db = null;

        const COLLECTION_NAME = "expedientes";
        const CONFIG_COLLECTION = "configuracion";
        const LOGO_DOC_ID = "logo_cliente";

        let allRecords = [];
        let currentTab = 'porLlegar';
        let subTabAlertaActual = 'operativas';
        let sortColumnIndex = null;
        let sortDirection = 'asc';
        let cacheClientes = [];

        async function sincronizarClientesCache() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/clientes`);
                const data = await res.json();
                if (data.success && data.clientes) {
                    cacheClientes = data.clientes;
                }
            } catch (err) {
                console.error("Error sincronizando caché de clientes:", err);
            }
        }
        sincronizarClientesCache();

        window.openClientesModal = function() {
            document.getElementById("clientesModal").classList.remove("hidden");
            renderizarTablaClientesModal();
        };

        window.closeClientesModal = function() {
            document.getElementById("clientesModal").classList.add("hidden");
        };

        window.limpiarFormularioCliente = function() {
            document.getElementById("clienteForm").reset();
            document.getElementById("web_clienteId").value = "";
            document.getElementById("clienteFormTitle").innerText = "Registrar / Editar Cliente";
        };

        async function renderizarTablaClientesModal() {
            await sincronizarClientesCache();
            const tbody = document.getElementById("clientesTableBody");
            if (!tbody) return;
            tbody.innerHTML = "";

            if (cacheClientes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-slate-400">No hay clientes registrados.</td></tr>`;
                return;
            }

            cacheClientes.forEach(c => {
                let estadoChecked = c.enviarAutomatico !== false ? 'checked' : '';
                let switchHtml = `
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" ${estadoChecked} onchange="cambiarEstadoAutoCliente('${c.id}', this.checked)" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-600"></div>
                    </label>
                `;

                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50 border-b border-slate-100 text-xs";
                tr.innerHTML = `
                    <td class="p-2.5 text-center">
                        <button type="button" onclick="editarClienteModal('${c.id}')" class="text-blue-600 font-bold mr-2" title="Editar">✏️</button>
                        <button type="button" onclick="eliminarClienteModal('${c.id}')" class="text-red-600 font-bold" title="Eliminar">🗑️</button>
                    </td>
                    <td class="p-2.5 font-bold text-blue-900">${c.razonSocial || ''}</td>
                    <td class="p-2.5 text-slate-600">${c.rif || ''}</td>
                    <td class="p-2.5 text-slate-600">${c.telefono || 'S/N'}</td>
                    <td class="p-2.5 text-slate-600">${c.correo || 'S/C'}</td>
                    <td class="p-2.5 text-center">
                        <button type="button" onclick="forzarEstatusCliente('${c.id}', '${c.razonSocial}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded text-[11px] font-bold shadow">
                            🚀 Enviar Forzado
                        </button>
                    </td>
                    <td class="p-2.5 text-center">${switchHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.editarClienteModal = function(id) {
            const cliente = cacheClientes.find(c => c.id === id);
            if (!cliente) return;
            document.getElementById("web_clienteId").value = cliente.id;
            document.getElementById("web_razonSocial").value = cliente.razonSocial || '';
            document.getElementById("web_rif").value = cliente.rif || '';
            document.getElementById("web_direccion").value = cliente.direccion || '';
            document.getElementById("web_telefono").value = cliente.telefono || '';
            document.getElementById("web_correo").value = cliente.correo || '';
            document.getElementById("web_enviarAutomatico").checked = cliente.enviarAutomatico !== false;
            document.getElementById("clienteFormTitle").innerText = "Editar Cliente: " + cliente.razonSocial;
        };

        window.cambiarEstadoAutoCliente = async function(id, nuevoEstado) {
            try {
                const cliente = cacheClientes.find(c => c.id === id);
                if (!cliente) return;
                cliente.enviarAutomatico = nuevoEstado;
                await fetch(`${BACKEND_URL}/api/clientes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: cliente.id,
                        razonSocial: cliente.razonSocial,
                        rif: cliente.rif,
                        direccion: cliente.direccion,
                        telefono: cliente.telefono,
                        correo: cliente.correo,
                        enviarAutomatico: cliente.enviarAutomatico
                    })
                });
            } catch (e) {
                console.error(e);
            }
        };

        window.eliminarClienteModal = async function(id) {
            if (!confirm("¿Desea eliminar este cliente de la base de datos?")) return;
            try {
                const response = await fetch(`${BACKEND_URL}/api/clientes/${id}`, { method: 'DELETE' });
                const resData = await response.json();
                if (resData.success) {
                    alert("🗑️ Cliente eliminado con éxito.");
                    await sincronizarClientesCache();
                    renderizarTablaClientesModal();
                }
            } catch (err) {
                alert("❌ Error: " + err.message);
            }
        };

        window.guardarClienteWeb = async function(e) {
            e.preventDefault();
            const clienteData = {
                id: document.getElementById("web_clienteId").value.trim(),
                razonSocial: document.getElementById("web_razonSocial").value.trim(),
                rif: document.getElementById("web_rif").value.trim(),
                direccion: document.getElementById("web_direccion").value.trim(),
                telefono: document.getElementById("web_telefono").value.trim(),
                correo: document.getElementById("web_correo").value.trim(),
                enviarAutomatico: document.getElementById("web_enviarAutomatico").checked
            };

            try {
                const response = await fetch(`${BACKEND_URL}/api/clientes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(clienteData)
                });
                const resData = await response.json();
                if (resData.success) {
                    alert("✅ ¡Cliente guardado con éxito en la nube!");
                    limpiarFormularioCliente();
                    await sincronizarClientesCache();
                    renderizarTablaClientesModal();
                }
            } catch (err) {
                alert("❌ Error: " + err.message);
            }
        };

        window.forzarEstatusCliente = async function(clienteId, razonSocial) {
            const mensaje = prompt(`Ingrese el estatus a enviar para el cliente: ${razonSocial}`, "Estimado cliente, su carga presenta actualización de estatus reciente.");
            if (!mensaje) return;

            const clienteObj = cacheClientes.find(c => c.id === clienteId);
            if (!clienteObj || !clienteObj.correo) {
                alert("⚠️ Este cliente no tiene correo registrado.");
                return;
            }

            try {
                const res = await fetch(`${BACKEND_URL}/api/enviar-correo-cliente`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        correoCliente: clienteObj.correo, 
                        nombreCliente: razonSocial, 
                        numExpediente: "GENERAL", 
                        statusActual: mensaje,
                        bl: "S/N",
                        campoLegible: "Estatus General",
                        modoTransporte: "Marítimo",
                        observaciones: ""
                    })
                });
                const data = await res.json();
                if (data.success) alert("✅ ¡Correo enviado correctamente!");
            } catch (err) {
                alert("❌ Error de red al enviar.");
            }
        };

        // FUNCIONES AUXILIARES GLOBALES EXPUESTAS
        window.actualizarListasDatalists = function(data) {
            const campos = ["cliente", "proveedor", "linea", "pais_origen", "buque_origen_vuelo", "puerto_transbordo", "almacen"];
            campos.forEach(campoId => {
                const input = document.getElementById(campoId);
                const dropdown = document.getElementById(`dropdown_${campoId}`);
                if (!input || !dropdown) return;

                let valoresUnicos = [];
                if (campoId === 'cliente') {
                    if (typeof cacheClientes !== 'undefined' && cacheClientes.length > 0) {
                        valoresUnicos = cacheClientes.map(c => c.razonSocial).filter(Boolean);
                    }
                } else {
                    valoresUnicos = [...new Set(data.map(r => r[campoId]).filter(Boolean))];
                }
                valoresUnicos.sort();

                function cerrarDropdown() {
                    dropdown.style.display = "none";
                    dropdown.innerHTML = "";
                }

                function renderizarOpciones(filtrados) {
                    dropdown.innerHTML = "";
                    if (filtrados.length === 0) {
                        cerrarDropdown();
                        return;
                    }
                    filtrados.forEach((val) => {
                        const item = document.createElement("div");
                        item.className = "custom-dropdown-item";
                        item.innerText = val;
                        item.addEventListener("mousedown", function(e) {
                            e.preventDefault(); 
                            input.value = val;
                            cerrarDropdown();
                            if (campoId === 'linea') window.sincronizarNaviera();
                        });
                        dropdown.appendChild(item);
                    });
                    dropdown.style.display = "block";
                }

                input.onfocus = function() { renderizarOpciones(valoresUnicos); };
                input.oninput = function() {
                    const filtrados = valoresUnicos.filter(v => String(v).toLowerCase().includes(this.value.toLowerCase()));
                    renderizarOpciones(filtrados);
                };
                input.onblur = function() { setTimeout(cerrarDropdown, 200); };
            });
        };

        window.sortTableByColumn = function(colName) {
            if (sortColumnIndex === colName) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumnIndex = colName;
                sortDirection = 'asc';
            }
            window.filterData();
        };

        function getFilteredAndSortedRecords() {
            const query = document.getElementById("searchInput") ? document.getElementById("searchInput").value.toLowerCase().trim() : "";
            const nonArchived = allRecords.filter(r => !esHistoricoArchivado(r));

            let targetRecords = nonArchived.filter(rec => {
                const matchesTab = getExpCategory(rec) === currentTab;
                const matchesGlobal = query !== "" ? Object.values(rec).some(val => String(val).toLowerCase().includes(query)) : true;
                return matchesTab && matchesGlobal;
            });

            targetRecords.sort((a, b) => {
                if (sortColumnIndex !== null) {
                    let valA = (a[sortColumnIndex] || "").toString().toLowerCase();
                    let valB = (b[sortColumnIndex] || "").toString().toLowerCase();
                    let comp = valA.localeCompare(valB, undefined, { numeric: true, sensitivity: 'base' });
                    return sortDirection === 'asc' ? comp : -comp;
                }
                let fA = parseFechaLocal(a.eta_la_guaira || a.fecha_llegada) || new Date('9999-12-31');
                let fB = parseFechaLocal(b.eta_la_guaira || b.fecha_llegada) || new Date('9999-12-31');
                return fA - fB;
            });

            return targetRecords;
        }

        window.filterData = function() {
            const targetRecords = getFilteredAndSortedRecords();
            renderTable(targetRecords);
            updateTabCounters(allRecords);
        };

        function renderTable(data) {
            const tbody = document.getElementById("dataTableBody");
            if (!tbody) return;
            tbody.innerHTML = "";
            const activeData = data.filter(r => !esHistoricoArchivado(r));
            const recordCountEl = document.getElementById("recordCount");
            if (recordCountEl) recordCountEl.innerText = `${activeData.length} registros`;

            if (activeData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="48" class="text-center py-8 text-slate-400">No hay expedientes en esta sección.</td></tr>`;
                return;
            }

            activeData.forEach((rec, index) => {
                const tr = document.createElement("tr");
                const isDespachado = Boolean(rec.despacho);
                let stickyBgColor = isDespachado ? "#fee2e2" : (index % 2 === 0 ? "#ffffff" : "#f8fafc");

                tr.className = (isDespachado ? "bg-red-100 hover:bg-red-200" : (index % 2 === 0 ? "bg-white hover:bg-slate-50" : "bg-slate-50 hover:bg-slate-100")) + " transition";
                 
                let htmlActions = `<td class="p-3 sticky-col-0" style="background-color: ${stickyBgColor} !important;"><button onclick="editRecord('${rec.id}')" class="text-blue-600 font-bold mr-2" title="Editar">✏️</button><button onclick="deleteRecord('${rec.id}')" class="text-red-600 font-bold" title="Eliminar">🗑️</button></td>`;
                let htmlTracking = `<td class="p-3 sticky-col-1" style="background-color: ${stickyBgColor} !important;">${generarTrackingLink(rec)}</td>`;
                let htmlModo = `<td class="p-3 font-bold text-center sticky-col-2 ${rec.modo_transporte === 'Aéreo' ? 'text-sky-600' : 'text-blue-900'}" style="background-color: ${stickyBgColor} !important;">${rec.modo_transporte || 'Marítimo'}</td>`;
                let htmlExp = `<td class="p-3 font-semibold sticky-col-3" style="background-color: ${stickyBgColor} !important;">${rec.num_expediente || ''}</td>`;
                let htmlCli = `<td class="p-3 font-semibold sticky-col-4" style="background-color: ${stickyBgColor} !important;">${rec.cliente || ''}</td>`;

                let remainingFields = fieldsList.filter(f => !["modo_transporte", "num_expediente", "cliente"].includes(f));
                let htmlFields = remainingFields.map(field => {
                    let val = rec[field] || '';
                    if (field === 'peso_bl' && val !== '') {
                        val = Number(val).toFixed(2);
                    } else if (camposFechas.includes(field) && val) {
                        val = formatearFechaDDMMYYYY(val);
                    }
                    return `<td class="p-3 border-r border-slate-200 snap-col" title="${val}">${val}</td>`;
                }).join('');

                tr.innerHTML = htmlActions + htmlTracking + htmlModo + htmlExp + htmlCli + htmlFields;
                tbody.appendChild(tr);
            });
        }

        function esHistoricoArchivado(rec) {
            if (!rec.despacho) return false;
            const dDespacho = parseFechaLocal(rec.despacho);
            if (!dDespacho) return false;
            const today = new Date();
            today.setHours(0,0,0,0);
            return Math.round((today - dDespacho) / (1000 * 60 * 60 * 24)) > 30;
        }

        function parseFechaLocal(str) {
            if (!str) return null;
            str = String(str).trim();
            if (str === "0" || (!str.includes('/') && !str.includes('-'))) return null;
            if (str.includes('/')) {
                const p = str.split('/');
                if (p.length === 3 && p[2].length === 4) {
                    const dia = parseInt(p[0], 10);
                    const mes = parseInt(p[1], 10) - 1;
                    const anio = parseInt(p[2], 10);
                    const fechaObj = new Date(anio, mes, dia);
                    if (fechaObj.getFullYear() === anio && fechaObj.getMonth() === mes && fechaObj.getDate() === dia) return fechaObj;
                }
            }
            return null;
        }

        function formatearFechaDDMMYYYY(str) {
            if (!str) return "";
            str = String(str).trim();
            if (str.includes('-')) {
                const p = str.split('-');
                if (p.length === 3 && p[0].length === 4) return `${p[2]}/${p[1]}/${p[0]}`;
            }
            return str;
        }

        window.sincronizarNaviera = function() {
            const lineaVal = document.getElementById("linea") ? document.getElementById("linea").value : "";
            const navieraEl = document.getElementById("naviera");
            if (navieraEl) navieraEl.value = lineaVal;
        };

        window.saveExp = async function(e) {
            e.preventDefault();
            const idVal = document.getElementById("recordId").value;
            const record = {};
            fieldsList.forEach(f => { record[f] = document.getElementById(f)?.value.trim() || ""; });

            const nombreCliente = record.cliente;
            if (nombreCliente) {
                const existe = cacheClientes.some(c => String(c.razonSocial).trim().toLowerCase() === String(nombreCliente).toLowerCase());
                if (!existe) {
                    const confirmar = confirm(`⚠️ El cliente "${nombreCliente}" no está registrado en el directorio.\n\n¿Desea agregarlo ahora para completar sus datos?`);
                    if (confirmar) {
                        window.openClientesModal();
                        const inputRazon = document.getElementById("web_razonSocial");
                        if (inputRazon) inputRazon.value = nombreCliente;
                        const inputRif = document.getElementById("web_rif");
                        if (inputRif) inputRif.focus();
                        return; 
                    }
                }
            }

            try {
                if (idVal) {
                    await updateDoc(doc(db, COLLECTION_NAME, idVal), record);
                } else {
                    await addDoc(collection(db, COLLECTION_NAME), record);
                }

                if (nombreCliente) {
                    const clienteObj = cacheClientes.find(c => String(c.razonSocial).trim().toLowerCase() === String(nombreCliente).toLowerCase());
                    if (clienteObj && clienteObj.correo && clienteObj.enviarAutomatico !== false) {
                        let campoEvento = "Actualización reciente";
                        let valorEvento = "Estatus de carga modificado";

                        if (record.fecha_llegada) {
                            campoEvento = "Fecha de Llegada";
                            valorEvento = record.fecha_llegada;
                        } else if (record.eta_la_guaira) {
                            campoEvento = "ETA La Guaira";
                            valorEvento = record.eta_la_guaira;
                        } else if (record.fecha_transmision) {
                            campoEvento = "Fecha de Transmisión";
                            valorEvento = record.fecha_transmision;
                        } else if (record.despacho) {
                            campoEvento = "Fecha de Despacho";
                            valorEvento = record.despacho;
                        }

                        let textoObsLimpio = record.observaciones ? record.observaciones.trim() : "";

                        await notificarCambioAutomatico(
                            clienteObj.correo,
                            nombreCliente,
                            record.num_expediente || "XXXX",
                            valorEvento,
                            record.awb_bl || "XXXXX",
                            campoEvento,
                            record.modo_transporte || "Marítimo",
                            textoObsLimpio
                        );
                    }
                }

                window.closeModal();
            } catch (err) { 
                alert("Error al guardar: " + err.message); 
            }
        };

        async function notificarCambioAutomatico(correoCliente, nombreCliente, numExpediente, statusActual, bl, campoLegible, modoTransporte, observaciones) {
            try {
                await fetch(`${BACKEND_URL}/api/enviar-correo-cliente`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        correoCliente: correoCliente,
                        nombreCliente: nombreCliente,
                        numExpediente: numExpediente,
                        statusActual: statusActual,
                        bl: bl,
                        campoLegible: campoLegible,
                        modoTransporte: modoTransporte,
                        observaciones: observaciones
                    })
                });
            } catch (error) {
                console.error("Error al disparar el correo automático:", error);
            }
        }

        window.editRecord = function(id) { 
            const rec = allRecords.find(r => r.id === id); 
            if (rec) window.openModal(rec); 
        };

        window.deleteRecord = async function(id) { 
            if (confirm("¿Eliminar expediente de la nube?")) 
                await deleteDoc(doc(db, COLLECTION_NAME, id)); 
        };

        window.toggleStats = function() {
            const statsSection = document.getElementById('statsSection');
            if (statsSection) statsSection.classList.toggle('hidden');
        };

        window.guardarConfiguracionCorreo = async function() {
            const correo = document.getElementById("config_correoUser").value.trim();
            const pass = document.getElementById("config_correoPass").value.trim();
            if (!correo || !pass) {
                alert("⚠️ Por favor ingrese ambos campos.");
                return;
            }
            try {
                const configRef = doc(db, CONFIG_COLLECTION, "credenciales_correo");
                await setDoc(configRef, { correoUser: correo, correoPass: pass });
                alert("✅ ¡Credenciales guardadas con éxito!");
            } catch (err) {
                alert("❌ Error: " + err.message);
            }
        };

        window.guardarCorreosInternosWeb = async function() {
            const correosTxt = document.getElementById("config_correosInternos").value.trim();
            if (!correosTxt) {
                alert("⚠️ Por favor ingrese al menos un correo.");
                return;
            }
            try {
                const configRef = doc(db, CONFIG_COLLECTION, "config_internos");
                await setDoc(configRef, { correosInternos: correosTxt });
                alert("✅ ¡Correos internos guardados con éxito!");
            } catch (err) {
                alert("❌ Error: " + err.message);
            }
        };

        async function inicializarAppFirebase() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/config`);
                const config = await response.json();

                if (!config.firebaseProjectId) {
                    throw new Error("El servidor no devolvió un proyecto de Firebase válido.");
                }

                const firebaseConfig = {
                    apiKey: config.firebaseApiKey,
                    projectId: config.firebaseProjectId,
                    authDomain: `${config.firebaseProjectId}.firebaseapp.com`,
                    storageBucket: `${config.firebaseProjectId}.firebasestorage.app`
                };
                
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);

                window.initCloudDB();

            } catch (error) {
                console.error("Error al cargar la configuración de Firebase:", error);
            }
        }

        window.initCloudDB = async function() {
            await sincronizarClientesCache();

            const logoRef = doc(db, CONFIG_COLLECTION, LOGO_DOC_ID);
            getDoc(logoRef).then((docSnap) => {
                if (docSnap.exists() && docSnap.data().imagenBase64) {
                    const savedLogo = docSnap.data().imagenBase64;
                    const logoPreview = document.getElementById("userLogoPreview");
                    if (logoPreview) {
                        logoPreview.src = savedLogo;
                        document.getElementById("userLogoContainer").classList.remove("hidden");
                        document.getElementById("userLogoUploadBtn").classList.add("hidden");
                    }
                }
            }).catch(err => console.error(err));

            onSnapshot(collection(db, COLLECTION_NAME), (snapshot) => {
                allRecords = [];
                if (!snapshot.empty) {
                    snapshot.forEach((docSnap) => {
                        let data = docSnap.data();
                        camposFechas.forEach(f => {
                            if (data[f]) data[f] = formatearFechaDDMMYYYY(data[f]);
                        });
                        allRecords.push({ id: docSnap.id, ...data });
                    });
                }
                
                allRecords.sort((a, b) => {
                    let expA = (a.num_expediente || "").toString().trim();
                    let expB = (b.num_expediente || "").toString().trim();
                    return expA.localeCompare(expB, undefined, { numeric: true, sensitivity: 'base' });
                });

                window.actualizarListasDatalists(allRecords);
                updateTabCounters(allRecords);
                window.filterData();
            });
        };

        inicializarAppFirebase();
    </script>
